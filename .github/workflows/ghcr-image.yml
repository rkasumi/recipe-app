name: GHCR Image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: image
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: candidate
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            ghcr.io/rkasumi/recipe-app:latest
            ghcr.io/rkasumi/recipe-app:sha-${{ steps.image.outputs.short_sha }}
      - name: Verify native database and API in the runtime image
        env:
          IMAGE_ID: ${{ steps.candidate.outputs.imageid }}
        run: |
          docker run --rm --network none \
            -v "$PWD/fixtures:/fixtures:ro" \
            -v "$PWD/scripts:/checks:ro" \
            --entrypoint node "$IMAGE_ID" /checks/image-smoke.mjs /fixtures/recipes
      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        id: build
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/rkasumi/recipe-app:latest
            ghcr.io/rkasumi/recipe-app:sha-${{ steps.image.outputs.short_sha }}
      - name: Write image summary
        if: github.event_name != 'pull_request'
        run: echo "image digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
